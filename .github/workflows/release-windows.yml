name: Release Windows Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.11

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies
        run: uv pip install --python ".venv\\Scripts\\python.exe" -e ".[build]"

      - name: Resolve release tag
        id: meta
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.tag_name }}"
          } else {
            $tag = "${{ github.ref_name }}"
          }
          if ([string]::IsNullOrWhiteSpace($tag)) {
            throw "未获取到 release tag。"
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "asset_name=BOMCompare-$tag-windows-x64.exe" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build executable
        run: .venv\Scripts\python.exe -m PyInstaller .\bom_compare.spec --noconfirm --clean

      - name: Rename release asset
        shell: pwsh
        run: |
          Rename-Item -Path ".\dist\BOMCompare.exe" -NewName "${{ steps.meta.outputs.asset_name }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: BOMCompare-${{ steps.meta.outputs.tag }}-windows
          path: dist/${{ steps.meta.outputs.asset_name }}

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.meta.outputs.tag }}" `
            ".\dist\${{ steps.meta.outputs.asset_name }}" `
            --repo "${{ github.repository }}" `
            --title "${{ steps.meta.outputs.tag }}" `
            --generate-notes `
            --latest
